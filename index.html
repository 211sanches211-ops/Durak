<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Дурак</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(!window.Peer){document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');}</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#071522;--panel:#12293c;--pb:#20415c;--row:#0e2233;--text:#cfe6ff;--muted:#8aa7bf;--gold:#f6c453;--gd:#f0a92e;--cw:64px;--ch:92px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;background:radial-gradient(1100px 600px at 50% -10%,#0d2438,var(--bg) 65%);color:var(--text);font-family:'Nunito',system-ui,sans-serif;font-weight:700;user-select:none;display:flex;justify-content:center;overflow-x:hidden;}
  .wrap{width:100%;max-width:520px;padding:12px 10px 22px;}
  h1{margin:4px 0 10px;text-align:center;font-size:24px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.45);}
  .panel{background:var(--panel);border:1px solid var(--pb);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);}
  .screen{display:none;}.screen.active{display:block;}
  .menu{padding:18px 14px;text-align:center;}
  .menu p{color:var(--muted);font-size:13px;margin:6px 0;}
  .menu .lbl{color:var(--gold);font-weight:900;font-size:14px;margin-top:10px;}
  .moderow,.botsrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
  .btn{font-family:inherit;font-weight:900;font-size:14px;color:var(--text);background:linear-gradient(180deg,#21425f,#17334b);border:1px solid #2c4d6b;border-radius:14px;padding:11px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);margin:3px;}
  .btn.gold{background:linear-gradient(180deg,#ffd35e,var(--gd));color:#173049;border:none;box-shadow:0 5px 0 #c98a1e;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .btn.mode.sel,.btn.cnt.sel{border:2px solid var(--gold);box-shadow:0 0 16px rgba(247,209,84,.45);}
  .btn.hint.sel{border:2px solid #4fc3f7;box-shadow:0 0 14px rgba(79,195,247,.4);}
  .joinrow{display:flex;gap:8px;justify-content:center;margin-top:6px;}
  .joinrow input{width:110px;font-family:inherit;font-weight:800;font-size:16px;text-align:center;text-transform:uppercase;letter-spacing:4px;background:var(--row);border:1px solid #1c3a54;border-radius:12px;color:var(--text);padding:11px;outline:none;}
  .scorebar{padding:8px 12px;margin-bottom:8px;text-align:center;font-size:13px;color:var(--muted);}
  .scorebar .gold{color:var(--gold);font-weight:900;}
  .topbar{display:flex;gap:6px;padding:8px;margin-bottom:8px;}
  .chip{flex:1;background:var(--row);border:1px solid #1c3a54;border-radius:12px;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;}
  .chip .gold{color:var(--gold);font-weight:900;font-size:13px;}
  .deckwrap{position:relative;width:66px;height:46px;}
  .trumpmini{position:absolute;left:0;top:9px;width:44px;height:30px;border-radius:6px;background:linear-gradient(180deg,#fff,#e6edf4);border:1px solid #b9c7d4;color:#1c2b3a;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .trumpmini.red{color:#c62828;}
  .deck-pile{position:absolute;left:36px;top:0;width:24px;height:34px;border-radius:6px;background:repeating-linear-gradient(45deg,#1d5d8f,#1d5d8f 6px,#16486e 6px,#16486e 12px);border:1px solid #2c4d6b;}
  .msg{padding:9px 12px;margin-bottom:8px;text-align:center;font-weight:800;font-size:13px;min-height:40px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .timer{color:var(--gold);font-size:16px;font-weight:900;}
  .opps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0;}
  .opp{background:var(--row);border:1px solid #1c3a54;border-radius:12px;padding:5px 8px;min-width:84px;text-align:center;font-size:11px;color:var(--muted);}
  .opp .backs{display:flex;justify-content:center;margin-top:4px;}
  .opp .backs .card{width:24px;height:36px;border-radius:5px;margin-left:-11px;}
  .opp .backs .card:first-child{margin-left:0;}
  .opp.atk{border-color:var(--gold);box-shadow:0 0 10px rgba(246,196,83,.35);}
  .opp.def{border-color:#4fc3f7;box-shadow:0 0 10px rgba(79,195,247,.3);}
  .opp .tag{color:var(--gold);font-weight:900;}
  .hand{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-end;height:calc(var(--ch) + 30px);padding:10px 6px 12px;border-radius:14px;background:rgba(255,255,255,.05);margin:8px 0;position:relative;overflow:visible;}
  .hand .card{flex:0 0 auto;position:relative;transform-origin:50% 100%;transform:rotate(var(--rot,0deg)) translateY(var(--ty,0px));transition:transform .18s ease,box-shadow .18s ease;z-index:var(--z,1);}
  .hand .card + .card{margin-left:calc(var(--cw) * -0.42);}
  .hand .card.playable:hover{transform:rotate(var(--rot,0deg)) translateY(calc(var(--ty,0px) - 14px)) scale(1.06);z-index:100;}
  .hand .card.best-hint{border:3px solid #4fc3f7;box-shadow:0 0 18px rgba(79,195,247,.6);}
  .table-zone{min-height:160px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:flex-start;padding:12px;border-radius:18px;background:#0d2130;border:2px solid #1e3a52;transition:.2s;}
  .table-zone.drop-hover{border-color:var(--gold);box-shadow:0 0 22px rgba(246,196,83,.35);}
  .pair{position:relative;width:calc(var(--cw) + 22px);height:calc(var(--ch) + 26px);}
  .pair .card{position:absolute;left:0;top:0;}
  .pair .defense{left:16px;top:22px;transform:rotate(8deg);}
  .card{width:var(--cw);height:var(--ch);border-radius:10px;background:linear-gradient(180deg,#fff,#e6edf4);border:1px solid #b9c7d4;color:#1c2b3a;display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;font-weight:900;box-shadow:0 3px 8px rgba(0,0,0,.3);touch-action:none;}
  .card .small{font-size:14px;line-height:1;}.card .bottom{transform:rotate(180deg);}.card .big{font-size:28px;text-align:center;}
  .card.red{color:#c62828;}
  .card.trump{border:2px solid var(--gold);box-shadow:0 0 12px rgba(246,196,83,.45);}
  .card.back{background:repeating-linear-gradient(45deg,#1d5d8f,#1d5d8f 7px,#16486e 7px,#16486e 14px);border:1px solid #2c4d6b;}
  .card.playable{cursor:grab;}
  .card.pop-in{animation:pop .3s ease;}
  @keyframes pop{from{transform:scale(.5);opacity:0;}}
  .dragging-ghost{pointer-events:none;z-index:1000;box-shadow:0 18px 34px rgba(0,0,0,.6);}
  .fly{position:fixed;z-index:999;pointer-events:none;margin:0;}
  .controls{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:6px;}
  .overlay{position:fixed;inset:0;z-index:2000;background:rgba(4,10,18,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .modal{width:min(92vw,380px);padding:22px 18px;text-align:center;transform:scale(.9);transition:.25s;max-height:86vh;overflow:auto;}
  .overlay.show .modal{transform:scale(1);}
  .modal h2{margin:0 0 10px;font-size:24px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.45);}
  .modal p{margin:0 0 6px;color:var(--text);font-size:14px;word-break:break-all;}
  .rec-row{display:flex;align-items:center;gap:8px;background:var(--row);border:1px solid #1c3a54;border-radius:12px;padding:9px 12px;margin:6px 0;font-size:14px;}
  .rec-row.me{border:2px solid var(--gold);box-shadow:0 0 14px rgba(247,209,84,.35);}
  .rec-row .pos{width:22px;color:var(--muted);font-weight:900;}
  .rec-row .nm{flex:1;text-align:left;color:var(--text);font-weight:800;}
  .rec-row .sc{color:var(--gold);font-weight:900;}
  .settings{padding:16px 14px;text-align:left;}
  .settings h2{margin:0 0 16px;text-align:center;}
  .setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1c3a54;}
  .setting-row:last-child{border-bottom:none;}
  .setting-label{color:var(--text);font-weight:700;font-size:14px;}
  .toggle{position:relative;width:50px;height:28px;background:#1c3a54;border-radius:14px;cursor:pointer;transition:.2s;}
  .toggle.on{background:var(--gold);}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;}
  .toggle.on::after{left:25px;}
  [hidden]{display:none !important;}
    .btn.emote{padding:11px 10px;font-size:16px;}
  .bubble{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:1500;background:rgba(18,41,60,.95);border:2px solid var(--gold);border-radius:16px;padding:10px 18px;font-size:22px;font-weight:900;color:var(--text);animation:bub 2s ease forwards;pointer-events:none;}
  @keyframes bub{0%{opacity:0;transform:translate(-50%,-30%) scale(.7);}15%{opacity:1;transform:translate(-50%,-50%) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-70%) scale(1);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🃏 Дурак</h1>

  <div id="menuScreen" class="screen active">
    <div class="panel menu">
      <div class="scorebar" id="statsPanel" style="padding:0;border:0;background:none;"></div>
      <div class="lbl">Режим до раздачи</div>
      <div class="moderow">
        <button class="btn mode sel" id="modePod">Подкидной</button>
        <button class="btn mode" id="modePer">Переводной</button>
      </div>
      <div class="lbl">Один с ботами</div>
      <div class="botsrow">
        <button class="btn cnt sel" data-b="1">1 бот</button>
        <button class="btn cnt" data-b="2">2 бота</button>
        <button class="btn cnt" data-b="3">3 бота</button>
      </div>
      <button class="btn gold" id="btnBot">Играть с ботами</button>
      <div class="lbl">Онлайн с друзьями (2–4)</div>
      <div><button class="btn gold" id="btnCreate">Создать комнату</button></div>
      <div class="joinrow">
        <input id="roomInput" maxlength="4" placeholder="КОД">
        <button class="btn" id="btnJoin">Войти</button>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;">
        <button class="btn" id="btnRec">🏆 Рекорды</button>
        <button class="btn" id="btnSettings">⚙️ Настройки</button>
      </div>
    </div>
  </div>

  <div id="settingsScreen" class="screen">
    <div class="panel settings">
      <h2>⚙️ Настройки</h2>
      <div class="setting-row">
        <span class="setting-label">Звук</span>
        <div class="toggle on" id="toggleSound"></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Вибрация</span>
        <div class="toggle on" id="toggleVibe"></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Таймер хода (30 сек)</span>
        <div class="toggle on" id="toggleTimer"></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Подсказки</span>
        <div class="toggle on" id="toggleHint"></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Не гасить экран</span>
        <div class="toggle on" id="toggleWake"></div>
      </div>
      <div style="margin-top:20px;text-align:center;">
        <button class="btn gold" id="btnBack">Назад</button>
      </div>
    </div>
  </div>

  <div id="gameScreen" class="screen">
    <div class="topbar panel">
      <div class="chip"><div class="deckwrap"><div class="trumpmini" id="trumpMini"></div><div class="deck-pile" id="deckPile"></div></div><span class="gold" id="deckCount"></span></div>
      <div class="chip" id="modeChip"></div>
      <div class="chip" id="codeChip" hidden></div>
    </div>
    <div class="msg panel" id="message"></div>
    <div class="opps" id="opps"></div>
    <div class="table-zone" id="table"></div>
    <div class="controls">
      <button class="btn" id="btnPass">Бито</button>
      <button class="btn" id="btnTake">Беру</button>
      <button class="btn" id="btnTransfer" hidden>Перевести</button>
           <button class="btn hint" id="btnHint">💡</button>
      <button class="btn emote" data-e="👋">👋</button>
      <button class="btn emote" data-e="😅">😅</button>
      <button class="btn emote" data-e="🔥">🔥</button>
      <button class="btn emote" data-e="🎉">🎉</button>
      <button class="btn gold" id="btnStart" hidden>Старт</button>
      <button class="btn" id="btnCode" hidden>Код</button>
      <button class="btn" id="btnMenu">Меню</button>
    </div>
    <div class="hand" id="playerHand"></div>
    <div class="hint">Перетащи карту на стол или нажми на неё.</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal panel">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div id="recordsBox"></div>
    <div>
      <button class="btn" id="btnCopy" hidden>Скопировать ссылку</button>
      <button class="btn gold" id="btnAgain" hidden>Играть ещё</button>
      <button class="btn" id="btnClose" hidden>Закрыть</button>
    </div>
  </div>
</div>

<script>
  const $=id=>document.getElementById(id);
  const CW=64,CH=92,PREFIX='DURAK-';
   const PEER_CONFIG={host:'durak-peer.onrender.com',port:443,path:'/',secure:true,debug:0,config:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
  ]}};
  const TG_APP_LINK='https://t.me/Freegamedurak_bot/play';
  const L=v=>({11:'J',12:'Q',13:'K',14:'A'}[v]||String(v));
  const SUITS=['♠','♥','♦','♣'],VALUES=[6,7,8,9,10,11,12,13,14];
  const rectOf=el=>{const r=el.getBoundingClientRect();return{left:r.left,top:r.top,width:r.width,height:r.height};};
  const centerRect=(el,w,h)=>{const r=el.getBoundingClientRect();return{left:r.left+r.width/2-w/2,top:r.top+r.height/2-h/2,width:w,height:h};};
  if(window.Telegram){Telegram.WebApp.ready();Telegram.WebApp.expand();}
  const NAME=(window.Telegram&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user)?Telegram.WebApp.initDataUnsafe.user.first_name:'Игрок';
  const siteLink=()=>location.origin+location.pathname+'?room='+roomCode;
  const inviteLink=()=>TG_APP_LINK?TG_APP_LINK+'?startapp='+roomCode:siteLink();
  function copyFeedback(btn){const t=btn.textContent;btn.textContent='Скопировано!';setTimeout(()=>btn.textContent=t,1200);}

  const CFG={
    sound:localStorage.getItem('durakSound')!=='0',
    vibe:localStorage.getItem('durakVibe')!=='0',
    timer:localStorage.getItem('durakTimer')!=='0',
    hint:localStorage.getItem('durakHint')!=='0',
    wake:localStorage.getItem('durakWake')!=='0',
    mode:localStorage.getItem('durakMode')||'подкидной',
    bots:parseInt(localStorage.getItem('durakBots'))||1
  };
  function saveCfg(){localStorage.setItem('durakSound',CFG.sound?'1':'0');localStorage.setItem('durakVibe',CFG.vibe?'1':'0');localStorage.setItem('durakTimer',CFG.timer?'1':'0');localStorage.setItem('durakHint',CFG.hint?'1':'0');localStorage.setItem('durakWake',CFG.wake?'1':'0');localStorage.setItem('durakMode',CFG.mode);localStorage.setItem('durakBots',CFG.bots);}

  let ac=null;
  const initAudio=()=>{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==='suspended')ac.resume();};
  document.addEventListener('pointerdown',initAudio);
  function tone(f,d,type,v,sl,de){
    d=d||0.12;type=type||'sine';v=v||0.2;sl=sl||0;de=de||0;
    if(!ac||!CFG.sound)return;
    const s=ac.currentTime+de,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,s);
    if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),s+d);
    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v,s+0.01);g.gain.exponentialRampToValueAtTime(0.0001,s+d);
    o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+0.02);
  }
  const sfx={deal:()=>tone(520,0.06,'triangle',0.15,-120),thr:()=>tone(300,0.12,'triangle',0.2,250),def:()=>tone(600,0.1,'triangle',0.18,200),
    transfer:()=>{tone(660,0.09,'triangle',0.2,220);tone(880,0.12,'triangle',0.2,220,0.1);},
    bit:()=>{tone(523,0.09);tone(659,0.09,'sine',0.18,0,0.09);tone(784,0.12,'sine',0.18,0,0.18);},
    tak:()=>tone(400,0.25,'sawtooth',0.15,-250),inv:()=>tone(180,0.12,'square',0.1,-60),
    win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,0.14,'triangle',0.2,0,i*0.12)),
    lose:()=>[392,330,262].forEach((f,i)=>tone(f,0.18,'sine',0.2,0,i*0.14))};

  function vibe(pattern){if(CFG.vibe&&navigator.vibrate)navigator.vibrate(pattern);}

  let wakeLock=null;
  async function requestWakeLock(){
    if(!CFG.wake||!('wakeLock' in navigator))return;
    try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
  }
  function releaseWakeLock(){if(wakeLock){wakeLock.release();wakeLock=null;}}

  function loadDB(){try{return JSON.parse(localStorage.getItem('durakDB'))||{entries:{}};}catch(e){return{entries:{}};}}
  function saveDB(db){localStorage.setItem('durakDB',JSON.stringify(db));}
  function myEntry(){return loadDB().entries[NAME];}
  function recordResult(res){
    const db=loadDB();
    const e=db.entries[NAME]||(db.entries[NAME]={name:NAME,score:0,wins:0,losses:0,draws:0,streak:0,best:0});
    if(res==='win'){e.wins++;e.score+=100;e.streak++;e.best=Math.max(e.best,e.streak);}
    else if(res==='draw'){e.draws++;e.score+=50;e.streak=0;}
    else{e.losses++;e.streak=0;}
    saveDB(db);updateStats();
  }
  function updateStats(){
    const e=myEntry();
    $('statsPanel').innerHTML=e
      ?'Рейтинг: <span class="gold">'+e.score+'</span> • Побед: <span class="gold">'+e.wins+'</span> • Поражений: <span class="gold">'+e.losses+'</span> • Ничьих: <span class="gold">'+e.draws+'</span> • Серия: <span class="gold">'+e.streak+'</span>'
      :'Рейтинг: <span class="gold">0</span> • Сыграй первую партию!';
  }
  function showRecords(){
    const list=Object.values(loadDB().entries).sort((a,b)=>b.score-a.score||b.wins-a.wins).slice(0,10);
    $('recordsBox').innerHTML=list.length?list.map((e,i)=>
      '<div class="rec-row'+(e.name===NAME?' me':'')+'"><span class="pos">'+(i+1)+'</span><span class="nm">'+e.name+'</span><span class="sc">'+e.score.toLocaleString('ru')+'</span></div>').join(''):'<p>Пока пусто — стань первым!</p>';
    showModal('🏆 Топ‑10 игроков','Рейтинг: победа +100, ничья +50.',{close:true});
  }

  const createDeck=()=>{const d=[];for(const s of SUITS)for(const v of VALUES)d.push({s:s,v:v});return d;};
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
    const canBeat=(a,d,tr)=>{const ts=(tr&&tr.s)?tr.s:tr;return d.s===a.s?d.v>a.v:(d.s===ts&&a.s!==ts);};

  function nextActive(st,from){for(let k=1;k<=st.N;k++){const i=(from+k)%st.N;if(!st.out[i])return i;}return -1;}
  function newState(mode,N){
    const deck=shuffle(createDeck()),trump=deck[deck.length-1],hands=[];
    for(let i=0;i<N;i++)hands.push([]);
    for(let i=0;i<6;i++)for(let p=0;p<N;p++)hands[p].push(deck.shift());
    const st={mode:mode,N:N,deck:deck,trump:trump,hands:hands,table:[],discard:[],out:Array(N).fill(false),transferredBy:[],over:null,names:[]};
    st.attacker=Math.floor(Math.random()*N);

  function legalMoves(st,idx){

      res.canBito=st.table.length>0&&st.table.every(p=>p.defense);
    }else if(st.defender===idx){
      const undef=st.table.filter(p=>!p.defense);
      if(undef.length){
        const t=undef[0];
        st.hands[idx].forEach((c,i)=>{if(canBeat(t.attack,c,st.trump))res.legal.push(i);});
        res.canTake=true;

          const ranks=st.table.map(p=>p.attack.v),nd=nextActive(st,idx);

      const ranks2=ranksOnTable(st),defended2=st.table.filter(p=>p.defense).length,maxA2=Math.min(6,defended2+st.hands[st.defender].length);

      if(m.type==='msg'&&netHandlers.onmsg)netHandlers.onmsg(m.from,m.payload);

    stopTimer();
    const names=(isHost?lobbyNames:(lobby||[NAME])).filter(n=>n!==NAME);
    $('modeChip').textContent=selectedMode==='переводной'?'Переводной':'Подкидной';
    $('codeChip').hidden=!netMode;
    if(netMode)$('codeChip').innerHTML='Код: <span class="gold">'+roomCode+'</span>';
    $('opps').innerHTML=names.map(n=>'<div class="opp"><div>'+n+'</div><div class="backs"><div class="card back"></div></div></div>').join('')||'<div class="opp">Пока никого</div>';
    $('table').innerHTML='';$('playerHand').innerHTML='';
    $('btnStart').hidden=!(isHost&&!S&&lobbyNames.length>=2);
    $('btnCode').hidden=!netMode;
    setMessage(isHost?('Игроков: '+lobbyNames.length+'/4. Нажми «Старт».'):'Ждём, пока хост начнёт игру...');
    $('btnPass').disabled=true;$('btnTake').disabled=true;$('btnTransfer').hidden=true;
    $('trumpMini').style.visibility='hidden';$('deckCount').textContent='';
  }
  function render(){
    if(!V){if(netMode&&!S)renderLobby();return;}
    const tm=$('trumpMini');
    tm.textContent=L(V.trump.v)+V.trump.s;
    tm.classList.toggle('red',V.trump.s==='♥'||V.trump.s==='♦');
    tm.style.visibility=V.deck>0?'visible':'hidden';
    $('deckPile').style.opacity=V.deck>0?'1':'.25';
    $('deckCount').textContent=V.deck;
    $('modeChip').textContent=V.mode==='переводной'?'Переводной':'Подкидной';
    $('codeChip').hidden=!netMode;
    if(netMode)$('codeChip').innerHTML='Код: <span class="gold">'+roomCode+'</span>';
    $('btnCode').hidden=!netMode;
    $('btnStart').hidden=true;
    $('opps').innerHTML=V.others.map(o=>'<div class="opp '+(o.role==='А'?'atk':(o.role==='З'?'def':''))+'"><div>'+o.name+' '+(o.role?'<span class="tag">'+o.role+'</span>':'')+'</div><div class="backs">'+Array(Math.min(o.count,6)).fill('<div class="card back"></div>').join('')+'</div><div>'+o.count+' карт</div></div>').join('');
    const sig=V.table.map(p=>p.defense?2:1).join('');
    const tz=$('table');tz.innerHTML='';
    V.table.forEach(p=>{
      const pr=document.createElement('div');pr.className='pair';
      const a=cardEl(p.attack,V.trump.s);a.classList.add('attack');pr.appendChild(a);
      if(p.defense){const d=cardEl(p.defense,V.trump.s);d.classList.add('defense');pr.appendChild(d);}
      tz.appendChild(pr);
    });
    const oldLen=prevSig?prevSig.length:0;
    [...tz.children].forEach((pr,pi)=>{
      if(pi>=oldLen)pr.querySelector('.attack').classList.add('pop-in');
      else if(prevSig[pi]==='1'&&sig[pi]==='2')pr.querySelector('.defense').classList.add('pop-in');
    });
    prevSig=sig;
    const hand=$('playerHand');hand.innerHTML='';
    const best=hintMode?bestMove(S,V.you):-1;
    V.hand.forEach((c,i)=>{
      const el=cardEl(c,V.trump.s);
      if(V.legal.includes(i))el.classList.add('playable');
      if(i===best)el.classList.add('best-hint');
      el.addEventListener('pointerdown',e=>onCardDown(e,i,el));
      el.addEventListener('click',()=>{
        const now=Date.now();
        if(window.__lastPlay&&now-window.__lastPlay<400)return;
        if(!V||V.over)return;
        if(V.legal.includes(i))playOnce(i);
        else explainWhy(i);
      });
      hand.appendChild(el);
    });
    applyFan(hand,5);
    $('btnPass').disabled=!V.canBito;
    $('btnTake').disabled=!V.canTake;
    $('btnTransfer').hidden=V.mode!=='переводной';
    $('btnTransfer').disabled=!V.canTransfer;
    $('btnHint').classList.toggle('sel',hintMode);
    if(V.over&&!recorded){
      recorded=true;stopTimer();
      const res=V.over.draw?'draw':(V.over.durak===V.you?'loss':'win');
      recordResult(res);
      if(res==='win'){sfx.win();vibe([100,50,100,50,200]);}
      else if(res==='loss'){sfx.lose();vibe([500]);}
      else{sfx.bit();vibe([100,50,100]);}
      showModal(res==='draw'?'🤝 Ничья':(res==='win'?'🏆 Победа!':'😵 Поражение'),
        res==='draw'?'Все избавились от карт одновременно.':(res==='win'?'Ты не дурак! Отличная игра.':('Дурак: '+V.names[V.over.durak]+'.')),
        {again:true});
    }else if(!needDeal){setTurnMsg();startTimer();}
    if(needDeal){needDeal=false;dealAnim();}
  }
    function setTurnMsg(){
    if(V.attacker===V.you)setMessage('Твой ход: атакуй или подкидывай.');
    else if(V.defender===V.you&&V.table.some(p=>!p.defense))setMessage('Отбейся, возьми или переведи.');
    else if(V.table.length>0&&V.legal.length)setMessage(V.names[V.attacker]+' атакует на '+V.names[V.defender]+'. Можешь подкинуть карты того же достоинства.');
    else setMessage(V.names[V.attacker]+' атакует на '+V.names[V.defender]+'...');
  }
  async function dealAnim(){
    setMessage('Раздача карт...');
    const els=[...$('playerHand').children];
    els.forEach(el=>el.style.visibility='hidden');
    const from=centerRect($('deckPile'),CW,CH);
    els.forEach((el,i)=>setTimeout(()=>sfx.deal(),i*90));
    await Promise.all(els.map((el,i)=>flyCard(V.hand[i],from,rectOf(el),V.trump.s).then(()=>el.style.visibility='')));
    setTurnMsg();
    startTimer();
  }

  function isOverTable(x,y){const r=$('table').getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
  function onCardDown(e,index,el){
    if(!V||V.over)return;
    if(!V.legal.includes(index)){explainWhy(index);return;}
    e.preventDefault();
    const sr=rectOf(el),sx=e.clientX,sy=e.clientY,rot=el.style.getPropertyValue('--rot')||'0deg';
    let moved=false,ghost=null,finished=false;
    try{el.setPointerCapture(e.pointerId);}catch(err){}
    const finish=()=>{finished=true;el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',cn);};
    const move=ev=>{
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!moved&&Math.hypot(dx,dy)>8){moved=true;ghost=el.cloneNode(true);ghost.classList.add('dragging-ghost');Object.assign(ghost.style,{position:'fixed',left:sr.left+'px',top:sr.top+'px',width:sr.width+'px',height:sr.height+'px',margin:'0',transform:'rotate('+rot+')'});document.body.appendChild(ghost);el.style.visibility='hidden';}
      if(moved){ghost.style.transform='translate('+dx+'px,'+dy+'px) rotate(3deg) scale(1.05)';$('table').classList.toggle('drop-hover',isOverTable(ev.clientX,ev.clientY));}
    };
    const up=ev=>{
      finish();
      $('table').classList.remove('drop-hover');
      if(!moved){playOnce(index);return;}
      if(isOverTable(ev.clientX,ev.clientY)){if(ghost){ghost.remove();}el.style.visibility='';playOnce(index);}
      else{if(ghost){ghost.style.transition='transform .2s';ghost.style.transform='translate(0,0) rotate('+rot+')';setTimeout(()=>{ghost.remove();el.style.visibility='';},210);}else{el.style.visibility='';}}
    };
    const cn=()=>{finish();if(ghost){ghost.remove();el.style.visibility='';}};
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',cn);
    setTimeout(()=>{if(!finished&&moved)cn();},3000);
  }

  (function(){
    const p=(new URLSearchParams(location.search).get('room')
      || (window.Telegram&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.start_param)||'').toUpperCase();
    if(p){$('roomInput').value=p;setTimeout(()=>joinRoom(p),500);}
  })();

  updateStats();
    function showBubble(t){const d=document.createElement('div');d.className='bubble';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2000);}
  document.querySelectorAll('.emote').forEach(b=>{b.onclick=()=>{const t=b.dataset.e;showBubble(NAME+' '+t);if(netMode&&isHost)conns.forEach(c=>netSend(c.id,{type:'emote',name:NAME,text:t}));else if(netMode&&!isHost)netSend(hostId||PREFIX+roomCode,{type:'emote',name:NAME,text:t});};});
  updateStats();
</script>
</body>
</html>
